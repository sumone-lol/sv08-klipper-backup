# Main
#   + Tune
#       + Offset Z:0.00
#       + Speed: 000%
#       + Square Corner Velocity: 000
#       + Min Cruise Ratio: 00%
#       + Flow: 000%
#       + PA: 0.000
#       + Smooth Time: 0.000
#   + Control
#       + Home All
#       + Home Z
#       + Home X/Y
#       + Z Tilt
#       + Quad Gantry Lvl
#       - Bed Mesh
#       + Disable Steppers
#           + Disable All
#           + Disable XY
#           + Disable Z
#           + Disable E
#       + Fan: OFF
#       + Fan speed: 000%
#       + Lights: OFF
#       + Lights: 000%
#       + Move 10mm
#           + Move X:000.0
#           + Move Y:000.0
#           + Move Z:000.0
#           + Move E:+000.0
#       + Move 1mm
#           + Move X:000.0
#           + Move Y:000.0
#           + Move Z:000.0
#           + Move E:+000.0
#       + Move 0.1mm
#           + Move X:000.0
#           + Move Y:000.0
#           + Move Z:000.0
#           + Move E:+000.0
#   + Temperature
#       + Ex0:000 (0000)
#       + Ex1:000 (0000)
#       + Bed:000 (0000)
#       - Preheat PLA
#           - Preheat all
#           - Preheat hotend
#           - Preheat hotbed
#       - Preheat ABS
#           - Preheat all
#           - Preheat hotend
#           - Preheat hotbed
#       + Cooldown
#           + Cooldown all
#           + Cooldown hotend
#           + Cooldown hotbed
#   + Filament
#       + Ex0:000 (0000)
#       + Load/Unload
#           + Load Fil. fast
#           + Load Fil. slow
#           + Unload Fil.fast
#           + Unload Fil.slow
#       + Feed: 000.0
#       + Retract: 000.0
#   + SD Card
#       + Start printing
#       + Clear File
#       + Resume printing
#       + Pause printing
#       + Cancel printing
#       + Clear files
#   + Setup
#       + Save config
#       + Restart
#           + Restart host
#           + Restart FW
#       + PID tuning
#           + Tune Hotend PID
#           + Tune Hotbed PID
#       + Calibration
          #+ Delta cal. auto
          #+ Delta cal. man
              #+ Start probing
              #+ Move Z: 000.00
             # + Test Z: ++
              #+ Accept
              #+ Abort
#           + Bed probe
#       + Dump parameters

### menu main ###
[menu __main]
type: list
name: Main

### menu tune ###
[menu __main __tune]
type: disabled
[menu __main tune]
index: 1
type: list
enable: True
name: Tune

[menu __main tune __speed]
type: disabled
[menu __main tune __flow]
type: disabled
[menu __main tune __offsetz]
type: disabled

[menu __main tune offsetz]
index: 1
type: input
name: Z Offset: {'%.2f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -5
input_max: 5
input_step: 0.01
realtime: False
gcode:
    SET_GCODE_OFFSET Z={'%.2f' % menu.input} MOVE=1

[menu __main tune speed]
index: 2
type: input
name: Speed:    {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.speed_factor}
input_min: 0.01
input_max: 5
input_step: 0.01
realtime: False
gcode:
    M220 S{'%d' % (menu.input*100)}

[menu __main tune squcorvel]
index: 3
type: input
name: SquCorVel: {'%d' % menu.input}~mms~
input: {printer.toolhead.square_corner_velocity}
input_min: 1
input_max: 100
input_step: 1
gcode:
    SET_VELOCITY_LIMIT square_corner_velocity={menu.input}

[menu __main tune MinCruRat]
index: 4
type: input
name: MinCruRat: {'%d' % (menu.input*100)}%
input: {printer.toolhead.minimum_cruise_ratio}
input_min: 0
input_max: 0.99
input_step: 0.01
gcode:
    SET_VELOCITY_LIMIT minimum_cruise_ratio={menu.input}

[menu __main tune flow]
index: 5
type: input
name: Flow:     {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.extrude_factor}
input_min: 0.01
input_max: 2
input_step: 0.01
realtime: False
gcode:
    M221 S{'%d' % (menu.input*100)}

[menu __main tune pa]
index: 6
type: input
name: PA:      {'%.3f' % (menu.input)}
input: {printer.extruder.pressure_advance}
input_min: 0
input_max: 0.5
input_step: 0.001
realtime: False
gcode:
    SET_PRESSURE_ADVANCE ADVANCE={'%.3f' % menu.input}

[menu __main tune smoothtime]
index: 7
type: input
name: SmoothT: {'%.3f' % (menu.input)}
input: {printer.extruder.smooth_time}
input_min: 0
input_max: 0.5
input_step: 0.001
realtime: False
gcode:
    SET_PRESSURE_ADVANCE SMOOTH_TIME={'%.3f' % menu.input}



