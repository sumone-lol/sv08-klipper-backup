# [menu __main control __disable]
# type: command
# name: Steppers off
# gcode:
#     M84
#     M18

[menu __main control __disable]
type: list
name: ~toggle~Steppers

[menu __main control __disable disableall]
type: command
name: ~toggle~ All
gcode:
    M84
    M18

[menu __main control __disable disablexy]
type: command
name: ~toggle~ XY
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_KINEMATIC_POSITION CLEAR_HOMED=XY

[menu __main control __disable disablez]
type: command
name: ~toggle~ Z
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z3 ENABLE=0
    SET_KINEMATIC_POSITION CLEAR_HOMED=Z

[menu __main control __disable disablee]
type: command
name: ~toggle~ E
gcode:
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

