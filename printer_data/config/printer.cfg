[include chopper_tune.cfg]
[include mainsail.cfg]
[include macros.cfg]
[include lcd_status.cfg]
[include options/probe/stock.cfg]
[include options/lcd/sovol-menu.cfg]
# [include menu.cfg]
# [include chopper_tune.cfg]
# [include timelapse.cfg]
# [include get_ip.cfg]
# [include plr.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_36FFD6054755303931831257-if00
restart_method: command

[mcu extra_mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_55FF69067186485342170487-if00
restart_method: command

[adxl345]
cs_pin: extra_mcu:PB12
axes_map: x,z,y

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PA8,   EXP1_2=PC9,
    EXP1_3=PA10,  EXP1_4=PA9,
    EXP1_5=PC11,  EXP1_6=PC10,
    EXP1_7=PD8,   EXP1_8=PC12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PB14,  EXP2_2=PB13,
    EXP2_3=PC7,   EXP2_4=PB12,
    EXP2_5=PC6,   EXP2_6=PB15,
    EXP2_7=PC8,   EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

[multi_pin part_fan]
pins: extra_mcu:PA7,extra_mcu:PB1

[duplicate_pin_override]
pins: extra_mcu:PA7,extra_mcu:PB1,PC5

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

# [temperature_sensor host_temp]
# sensor_type: temperature_host
# min_temp: 0
# max_temp: 110

[temperature_sensor Toolhead_Temp]
sensor_type: temperature_mcu
sensor_mcu: extra_mcu

[thermistor my_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[thermistor my_thermistor_e]
temperature1: 25
resistance1: 110000
temperature2: 100
resistance2: 7008
temperature3: 220
resistance3: 435

#----------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 35000
# max_accel_to_decel: 20000
minimum_cruise_ratio: 0.2
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5.0

#------------------

[stepper_x]
step_pin: PE2
dir_pin: !PE0
enable_pin: !PE3
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x: virtual_endstop
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE1
interpolate: true
run_current: 1.3
sense_resistor: 0.150
# stealthchop_threshold: 999999
uart_address: 3
# driver_sgthrs: 80 # 65
diag_pin: PE15
# driver_TBL: 1
# driver_TOFF: 2
driver_HSTRT: 4
driver_HEND: 6
# driver_SEMIN: 2
# driver_SEMAX: 4
# driver_SEUP: 3
# driver_SEDN: 2

[autotune_tmc stepper_x]
motor: shengyang-42bygh2904-a-24nq1
tbl: 1
toff: 3
extra_hysteresis: 2
semin: 2
semax: 4
seup: 3
sedn: 2
seimin: 0
sg4_thrs: 100

#------------------

[stepper_y]
step_pin: PB8
dir_pin: !PB6
enable_pin: !PB9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y: virtual_endstop
position_min: 0
position_endstop: 364
position_max: 364
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PB7
interpolate: true
run_current: 1.3
sense_resistor: 0.150
# stealthchop_threshold: 999999
uart_address: 3
# driver_sgthrs: 95 # 65
diag_pin: PE13
# driver_TBL: 1
# driver_TOFF: 2 
driver_HSTRT: 4
driver_HEND: 6
# driver_SEMIN: 2
# driver_SEMAX: 4
# driver_SEUP: 3
# driver_SEDN: 2

[autotune_tmc stepper_y]
motor: shengyang-42bygh2904-a-24nq1
tbl: 1
toff: 3
extra_hysteresis: 2
semin: 2
semax: 4
seup: 3
sedn: 2
sg4_thrs: 90

#------------------

[stepper_z] # motherboard: Z3
step_pin: PC0
dir_pin: PE5
enable_pin: !PC1
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 347
position_min: -5
# position_endstop: 0
homing_speed: 15.0
homing_retract_dist: 5.0
homing_retract_speed: 10.0 # 15.0
second_homing_speed: 4.0 # 10.0

[tmc2209 stepper_z]
uart_pin: PE6
interpolate: true
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 999999
uart_address:3

[stepper_z1] # motherboard: Z2
step_pin: PD3
dir_pin: !PD1
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PD2
interpolate: true
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 999999
uart_address: 3

[stepper_z2] # motherboard: Z1
step_pin: PD7
dir_pin: PD5
enable_pin: !PB5
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PD6
interpolate: true
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 999999
uart_address: 3

[stepper_z3] # motherboard: Z4
step_pin: PD11
dir_pin: !PD9
enable_pin: !PD12
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PD10
interpolate: true
run_current: 0.55
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

#------------------

[extruder]
step_pin: extra_mcu:PA8
dir_pin: extra_mcu:PB8
enable_pin: !extra_mcu: PB11
rotation_distance: 6.9
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150
heater_pin: extra_mcu:PB9
# sensor_type: my_thermistor_e
sensor_type: Generic 3950
pullup_resistor: 11500
sensor_pin: extra_mcu:PA5
smooth_time: 0.5
min_temp: 5
max_temp: 305
max_power: 1.0
min_extrude_temp: 10 # 150
# control: pid
# pid_kp: 33.838
# pid_ki: 5.223
# pid_kd: 47.752
pressure_advance: 0.025
pressure_advance_smooth_time: 0.04
max_extrude_cross_section: 2

[tmc2209 extruder]
uart_pin: extra_mcu:PB10
interpolate: true
run_current: 0.8
hold_current: 0.8
uart_address: 3
sense_resistor: 0.150
stealthchop_threshold: 0
driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 7
driver_HEND: 8

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 2

[filament_switch_sensor filament_sensor]
pause_on_runout: true
event_delay: 3.0
pause_delay: 0.5
switch_pin: PE9

[heater_bed]
heater_pin: PA0
sensor_type: my_thermistor
sensor_pin: PC5
max_power: 1.0
min_temp: 5
max_temp: 105
# control: pid
# pid_kp: 73.571
# pid_ki: 1.820
# pid_kd: 783.849
pwm_cycle_time: 0.02227

[verify_heater heater_bed]
max_error: 120
check_gain_time: 40
hysteresis: 5
heating_gain: 2

#----------------------------------------------------------

[probe]
pin: extra_mcu:PB6
x_offset: -17
y_offset: 10
# z_offset : 0
# speed: 15.0
speed: 2.0 # 5.0
samples: 4
sample_retract_dist: 0.6
lift_speed: 5 # 50
samples_result: average
samples_tolerance: 0.008 # 0.016
samples_tolerance_retries: 2

[probe_pressure]
pin: ^!PE12
x_offset: 2
y_offset: 1
z_offset : 1.5
speed: 1.0
samples: 3

[z_offset_calibration]
center_xy_position: 175, 175 # 191, 165
endstop_xy_position: 289, 361
z_hop: 10
z_hop_speed: 15

[z_thermal_adjust]
temp_coeff: 0.0025
smooth_time: 600
sensor_type: my_thermistor
sensor_pin: PC5
min_temp: 15
max_temp: 105

[quad_gantry_level]
gantry_corners:
	-80, -40    # -60, -10
	435, 470    # 410, 420
points:
    48, 1       # 36, 1
    48, 328     # 36, 320
    338, 328    # 346, 320
    338, 1      # 346, 10
speed: 150
horizontal_move_z: 5 # 10
retries: 5
retry_tolerance: 0.01 # 0.05
max_adjust: 4

[bed_mesh]
speed: 150 # 500
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 333, 340
probe_count: 9, 9
algorithm: bicubic
bicubic_tension: 0.4
split_delta_z: 0.0125 # 0.016
mesh_pps: 3, 3
adaptive_margin: 5
fade_start: 0
fade_end: 10
fade_target: 0

#----------------------------------------------------------

[homing_override]
gcode:
   {% if not 'Z' in params and not 'Y' in params and 'X' in params %}
      G28 X
      G0 X348 F1200
   {% elif not 'Z' in params and not 'X' in params and 'Y' in params %}
      G28 Y
      G0 Y360  F1200
   {% elif not 'Z' in params and 'X' in params and 'Y' in params %}
      G28 Y
      G0 Y360  F1200
      G4 P2000
      G28 X
      G0 X348  F1200
   {% elif 'Z' in params and not 'X' in params and not 'Y' in params %}
      G90
      G0 X175 Y175 F6000 # G0 X191 Y165 F6000
      G28 Z
      G0 Z10 F600
   {% else %}
      G90
      G0 Z5 F300
      G28 Y
      G0 Y360  F1200
      G4 P2000
      G28 X
      G0 X348  F1200
      G90
      G0 X175 Y175 F6000 # G0 X191 Y165 F6000
      G28 Z
      G28 Z
      G28 Z
      G0 Z10 F600
   {% endif %}
   SET_Z_THERMAL_ADJUST REF_TEMP=23
axes: xyz
set_position_z: 0

#----------------------------------------------------------

[fan]
pin: multi_pin:part_fan
off_below: 0.05

# [fan_generic fan0] # back model cooling fan
# pin: extra_mcu:PA7
# off_below: 0.05

# [fan_generic fan1] # front model cooling fan
# pin: extra_mcu:PB1
# off_below: 0.05

# [fan_generic fan3] # exhaust fan
# pin: PA2
# max_power: 1.0

[temperature_fan host_fan] # controller fan
pin: PA1
max_power: 1.0
off_below: 0.25
# kick_start_time: 0.5
sensor_type: temperature_host
min_temp: 5
max_temp: 90
target_temp: 60
control: pid
pid_Kp: 1
pid_Ki: 2
pid_Kd: 0
pid_deriv_time: 2.0
min_speed: 0.0

[heater_fan hotend_fan] # heat break fan
pin: extra_mcu:PA6
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50
tachometer_pin: extra_mcu:PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.0013

#----------------------------------------------------------

[input_shaper]
damping_ratio_x: 0.01
damping_ratio_y: 0.01
#shaper_type_x = mzv
#shaper_freq_x = 35
#shaper_type_y = mzv
#shaper_freq_y = 35

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 30  # an example175 Y175 Z30
accel_per_hz:100
min_freq:20
max_freq:134
max_smoothing:0.2
hz_per_sec:0.5

#----------------------------------------------------------

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[neopixel Screen_Colour]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.5
initial_GREEN: 0.33
initial_BLUE: 0.16

[output_pin main_led]
pin: PA3
pwm: 1
value: 1
cycle_time: 0.010

[output_pin beeper]
pin: EXP1_1
pwm: false
value: 0

#----------------------------------------------------------

[respond]

[pause_resume]

[exclude_object]

[gcode_arcs]
resolution: 1.0

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

[virtual_sdcard]
path:/home/biqu/printer_data/gcodes/
on_error_gcode: PAUSE

[save_variables]
filename: /home/biqu/printer_data/config/saved_variables.cfg

